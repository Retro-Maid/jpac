        caveats:
          - "⚠️ 測量法に基づく国土地理院長承認（複製）が併記されている。素の CC BY 4.0 ではない（survey_restriction）"
          - "⚠️ N03_007 が政令市で区コードか市コードかは未確認。神奈川県で実測してから結合を書く"
