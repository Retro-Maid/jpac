          reviewed_on: "2026-09-05"
          effect: >-
            N03 is NOT plain CC BY 4.0. The detail page carries a 測量法 reproduction
            approval number and an explicit approval requirement for 複製 — the same
            instrument that makes GSI 基盤地図情報 blocked (GEO_EXPANSION_RESEARCH.md §6.4).
            This overturns the ⭕ "素の CC BY 4.0" classification that §5.4 assigned to N03
            from the listing page alone, which is exactly the failure §5.4 warned about.
          unresolved: >-
            Whether redistributing the polygons, or derived values (representative points,
            areas, the reconciliation table), falls inside 複製 / 二次利用 requiring approval.
            Not decidable from the page; may require an enquiry to 国土地理院.
        redistribution:
          use_for_build: likely_permitted
          polygons: requires_gsi_approval_unresolved
          derived_non_geometry: unresolved
        evidence: terms_page_read
        reviewed_on: "2026-09-05"
        verdict: conditional
        priority: high
        design_doc: "docs/N03_BOUNDARY_DESIGN.md"
        attributes:
