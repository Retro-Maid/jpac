# Candidate source registry for the geo-expansion investigation.
#
# This is NOT config/sources.yml. Nothing here is fetched, and nothing here has
# cleared docs/LICENSE_POLICY.md §4 (verbatim read + committed text_sha256 baseline).
# It is the machine-readable form of docs/GEO_EXPANSION_RESEARCH.md, recorded so the
# survey is auditable and re-checkable rather than living only in prose.
#
# Before any entry moves into config/sources.yml it must gain:
#   - a publisher terms page read verbatim, with reviewed_on and text_sha256
#   - a per-layer licence block (国土数値情報 has no single project-wide licence)
#   - an explicit redistribution verdict for unmodified and modified payloads
#
# evidence:
#   measured          — counted from the publisher's actual payload this survey; strongest
#   terms_page_read   — the publisher's own terms page was fetched and read this survey
#   secondary         — taken from a listing page, catalog, or search summary; NOT proof
#
# join_bucket: how the dataset can reach a jpac 町字 (docs/GEO_EXPANSION_RESEARCH.md §2)
#   a = 市区町村コード / b = ABR 町字ID / c = 郵便番号 / d = geometry only / e = 住所文字列
#
# verdict:
#   clear      — redistributable on attribution-only terms; candidate for adoption
#   conditional— redistributable but with a clause that must be passed downstream
#   blocked    — cannot be redistributed by this project
#   deferred   — depends on unresolved work (usually the 町字 polygon problem)

version: "0.1.0"
survey_date: "2026-09-02"
research_doc: "docs/GEO_EXPANSION_RESEARCH.md"

# ---------------------------------------------------------------------------
# Prior art. Not sources — context for whether this project should exist as scoped.
# ---------------------------------------------------------------------------
prior_art:
  - name: "G空間情報センター"
    operator: "一般社団法人 社会基盤情報流通推進協議会 (AIGID)"
    url: "https://front.geospatial.jp/"
    layer: catalog
    evidence: terms_page_read
    note: >-
      Closest incumbent. A distribution platform, not a crosswalk: its own 約款 states
      that per-dataset conditions are set by each 情報提供者, so ID reconciliation
      remains the consumer's problem.
  - name: "国土交通データプラットフォーム"
    operator: "国土交通省"
    layer: catalog
    evidence: secondary
    note: "Cross-search and visualisation. No published address-ID crosswalk."
  - name: "デジタル庁 ベース・レジストリ"
    operator: "デジタル庁"
    layer: registry
    evidence: secondary
    note: >-
      Supersets this idea. 法人ベース・レジストリ went live 2026-03; 不動産ベース・
      レジストリ is planned. Building either ourselves is bad scoping.
  - name: "Geoshape リポジトリ / 国勢調査町丁・字等別境界データセット"
    operator: "ROIS-DS 人文学オープンデータ共同利用センター (CODH)"
    url: "https://geoshape.ex.nii.ac.jp/ka/"
    layer: feature_data
    license: "CC BY 4.0 (e-Stat 利用規約の遵守が条件)"
    evidence: terms_page_read
    note: "220,814 町丁・字等 (2020年版). Precedent that e-Stat 小地域 boundaries can be redistributed."
  - name: "Linked Open Addresses Japan"
    operator: "uedayou"
    layer: feature_data
    license: "CC BY-SA 4.0"
    evidence: secondary
    note: >-
      Nearest conceptual prior art: 国土数値情報 + 位置参照情報 + e-Stat merged into
      RDF with 行政区画ポリゴン. Differs by having no persistent ID, no provenance,
      no confidence, and by being share-alike.
  - name: "geolonia/japanese-addresses (v1/v2)"
    layer: feature_data
    evidence: secondary
    note: "Address normalisation, not a provenance-tracked crosswalk."
  - name: "Overture Maps Foundation"
    layer: feature_data
    license: "CDLA-Permissive 2.0 (transportation theme: ODbL)"
    evidence: terms_page_read
    note: "GERS is the global analogue of a persistent-ID crosswalk. Not joined to Japanese administrative IDs."
  - name: "公益財団法人 国土地理協会 全国町丁目・字界地図データベース"
    layer: feature_data
    license: "proprietary / paid"
    evidence: secondary
    note: "~180,000 町丁目 polygons. The commercial answer this project exists to avoid needing."

# ---------------------------------------------------------------------------
# The blocking question: a redistributable 町字 polygon source.
# ---------------------------------------------------------------------------
polygon_problem:
  statement: >-
    jpac holds 位置参照情報 代表点 only — one point per 大字・町丁目, and DATA_LICENSE.md
    commits to never describing it as more. A point cannot do point-in-polygon, so no
    join_bucket=d dataset (OSM roads, N02 stations, most 国土数値情報) can be attached to
    町字 without 町字 boundaries this project does not have.
  candidates:
    - name: "国勢調査 小地域（町丁・字等別）境界データ"
      publisher: "総務省統計局 / e-Stat 統計GIS"
      key: "KEY_CODE (JIS市区町村コード + 小地域コード)"
      license: "政府標準利用規約（第2.0版）準拠 / CC BY 互換"
      license_url: "https://www.e-stat.go.jp/terms-of-use"
      scope_note: >-
        統計地理情報システム機能利用規約 第6条: コンテンツの利用条件等は e-Stat 利用規約に
        準ずる。境界データそのものは e-Stat 本体規約側。
      redistribution: { unmodified: permitted, modified: permitted }
      evidence: terms_page_read
      verdict: deferred
      blocker: >-
        KEY_CODE is not machiaza_id. The official crosswalk is not merely absent — it is
        designed, published as a column (ABR 位置参照拡張 cns_bnd_s_area_kcode) and empty in
        all 337,641 rows nationwide as of 2026-09-02. See candidates.digital_agency
        "ABR 町字マスター位置参照拡張" for the measurement.
      year_scoped: true
      year_note: >-
        小地域 are re-cut at every census, so a KEY_CODE mapping is valid for one census year
        only. The v3 correspondence key must be (machiaza_id, key_code, census_year), not a
        pair with the year demoted to metadata. ABR's own (empty) schema agrees: cns_bnd_year
        is a separate column.
      # -------------------------------------------------------------------
      # Measured 2026-09-05 against the real payload (all 47 prefectures,
      # 令和2年国勢調査 小地域（町丁・字等）JGD2011 世界測地系緯度経度 Shapefile).
      # Full write-up: docs/ESTAT_BOUNDARY_VERIFICATION.md
      # -------------------------------------------------------------------
      measured_2026_09_05:
        evidence: measured
        download_bytes_all_47_prefectures: 322598028
        distribution: "都道府県別47ファイル。全国一括ファイルは無い"
        polygons_total: 232019
        polygons_town: 231668          # HCODE 8101
        polygons_water: 351            # HCODE 8154 水面調査区
        exclave_D: 323                 # KIGO_D='D' 飛び地
        enclave_D1: 7                  # KIGO_D='D1' 抜け地（他市区町村の飛び地が食い込む穴）
        island_I: 3787                 # KIGO_I='I'
        duplicate_boundary_KIGO_E: 17381   # 1町字が複数ポリゴンに分かれる (7.5%)
        prj_datum: "GCS_JGD_2011 (全47県で統一)"
        encoding: cp932
        municipality_reconciliation:
          jpac_municipalities: 1918
          estat_codes: 1897
          matched: 1889
          jpac_only: 29
          estat_only: 8
          unexplained: 0
          jpac_only_breakdown:
            designated_city_parents: 20
            northern_territories: 6    # 01695-01700。国勢調査未実施
            hamamatsu_new_wards: 3     # 22138/22139/22140
          estat_only_breakdown:
            hamamatsu_old_wards: 7     # 22131-22137
            unassigned_area: 1         # 13199（市区町村名が空。帰属未確定）
          note: >-
            e-Stat carries 政令指定都市 at WARD-code granularity (e.g. 14135 川崎市多摩区),
            so the 20 parent-city codes correctly have no polygon. This settles for e-Stat
            the ward-vs-city question left UNRESOLVED for N03 (see candidates.mlit N03_007).
        point_in_polygon:
          method: "jpac 位置参照情報 代表点 → e-Stat 小地域ポリゴン (HCODE 8101 のみ)"
          prefectures_tested: ["14", "13", "01", "27", "47", "22"]
          excluding_shizuoka: { points: 46210, matched: 46176, rate: 0.9993, mismatched: 9, outside_any_polygon: 25 }
          shizuoka: { points: 3637, matched: 3086, rate: 0.8485, mismatched: 551 }
          shizuoka_note: >-
            All 551 are 浜松市: jpac's post-reorganisation ward codes landing in e-Stat's
            pre-reorganisation ward polygons. A version skew resolvable via
            overrides/municipality_lineage.yml, not a boundary-accuracy failure — the points
            land in the correct CITY.
          points_in_multiple_polygons: 0
          caveat: >-
            Measured per prefecture, so the publisher's 県境未接合 warning did not surface;
            a nationwide merge is untested. The 9 mismatches sit on municipal borders and it
            is NOT established whether e-Stat or the 代表点 is the one that is off — a 代表点
            is not guaranteed to lie inside its own 町字.
        granularity_gap:
          estat_town_polygons: 231668
          jpac_machiaza: 726170
          ratio: 3.1
          effect: >-
            HARD EVIDENCE for the `blocker` above. e-Stat 町丁・字等 is roughly 3.1x coarser
            than ABR 町字, so this source does NOT deliver 町字 polygons — it delivers a
            coarser statistical partition. Assigning one e-Stat polygon to several jpac 町字
            would be the "expand a municipality-level statement down to 町字" move POLICY.md
            §4 forbids. Municipality-level use and 町字-level use are separate decisions.
      publisher_caveats_verbatim:
        source: "https://www.e-stat.go.jp/pdf/gis/notes/00200521.pdf"
        reviewed_on: "2026-09-05"
        items:
          - "調査区の境界を基に作成しているため、住居表示等で用いられている実際の町丁・字の境界と一致しない場合があります。また、町丁・字の名称についても、一致しない場合があります。"
          - "一つの市区町村内に同一の基本単位区又は町丁・字番号を持つ境域が複数存在する場合があり、このような場合には、重複フラグを付与し、識別できるようにしています。"
          - "面積は、それぞれの境界データの図郭により算出したものであり、市区町村内のすべての総計は、国土地理院等の公式な面積と一致しません。"
          - "都道府県の境界線は、接合処理を行っていないため、都道府県をまたがって市区町村を接合した場合には、都道府県の境界線にずれが生じる場合があります。"
          - "他県の飛び地の境域が市区町村に含まれる場合は、当該飛び地の境域情報も含まれます。また、水面調査区がある場合には、同様に水面調査区の情報も含まれます。"
      no_survey_law_clause:
        checked_2026_09_05:
          - "https://www.e-stat.go.jp/gis-terms"
          - "https://www.e-stat.go.jp/terms-of-use"
          - "https://www.e-stat.go.jp/gis/statmap-search?type=2"
          - "https://www.e-stat.go.jp/pdf/gis/notes/00200521.pdf"
          - "https://www.e-stat.go.jp/help/data-definition-information/downloaddata/A002005212020.pdf"
        finding: >-
          None of these carry a 測量法 / 国土地理院長承認 requirement — the instrument that
          makes N03 `conditional` and 基盤地図情報 `blocked`. The only 国土地理院 mention is a
          comparison of areas, not a rights claim. Absence of a statement is not proof of
          absence; this remains for the human LICENSE_POLICY.md §4 gate to confirm.
      catalog_discrepancy:
        url: "https://www.geospatial.jp/ckan/dataset/soumu-r2-town"
        catalog_says: "独自利用規約"
        publisher_chain_says: "統計地理情報システム機能利用規約 §6 → e-Stat 利用規約 → 政府標準利用規約 2.0 / CC BY 互換"
        resolution: "The publisher's own chain governs. Recorded as another instance of the §7 finding that catalog licence fields are unreliable."
    - name: "基盤地図情報（基本項目） CommBdry / CommPt（町字界線・町字代表点）"
      publisher: "国土地理院"
      license: "基本測量成果 — 測量法 §29 (複製) / §30 (使用) 承認体系"
      license_url: "https://www.gsi.go.jp/LAW/2930-qa.html"
      redistribution: { unmodified: approval_required, modified: approval_required }
      evidence: terms_page_read
      verdict: blocked
      note: >-
        GSI Q&A names 不特定多数への公開 and 独自データの大量付加 as cases requiring
        approval. DATA_LICENSE.md's reasoning that 位置参照情報 escapes 測量法 rests on
        the 国土数値情報 terms §1.2 and does NOT transfer to GSI products.
    - name: "登記所備付地図データ"
      publisher: "法務省 (via G空間情報センター)"
      key: "地番 (筆), with 大字・丁目 attributes"
      license: "登記所備付地図データ利用規約（令和5年1月23日制定、一部を除き政府標準利用規約 第2.0版 準拠）"
      redistribution: { unmodified: permitted, modified: permitted }
      evidence: terms_page_read
      verdict: conditional
      note: >-
        Could yield 町字 polygons bottom-up by dissolving 筆. Carries a discretionary
        clause absent from PDL: 法務省 may refuse any and all use. Coverage and accuracy
        vary by when each 図面 was made.
    - name: "標準地域メッシュ (JIS X 0410)"
      verdict: deferred
      note: "Fallback substrate that sidesteps boundaries entirely, at the cost of not being 町字."

# ---------------------------------------------------------------------------
# Share-alike contamination risk.
# ---------------------------------------------------------------------------
share_alike_risk:
  statement: >-
    All four current jpac sources are attribution-only (PDL 1.0 ×3 + Japan Post asserting
    no copyright). Merging an ODbL or CC BY-SA source into the same database can force the
    combined database to be offered under that licence, which would break DATA_LICENSE.md's
    design of flowing each publisher's own terms through separately.
  sources:
    - name: "OpenStreetMap"
      license: "ODbL 1.0"
      evidence: terms_page_read
      verdict: blocked
      mitigations_considered:
        - "Collective Database (OSMF guideline: independent iff a data type is all-OSM or all-non-OSM within a regional cut) — weak for a crosswalk table, which mixes by construction"
        - "Produced Work — fine for tiles, not for distributing a correspondence table"
        - "Physical separation into a separate ODbL repository — recommended if OSM is ever needed"
      alternative: "国土数値情報 N13 道路 (plain CC BY 4.0)"
    - name: "Overture Maps transportation theme"
      license: "ODbL 1.0 (inherited from OSM)"
      evidence: terms_page_read
      verdict: blocked
      note: "Overture is CDLA-Permissive 2.0 in general; transportation is not. Does not solve the OSM problem."

# ---------------------------------------------------------------------------
# 国土数値情報: NOT one licence. Per-layer, per-year.
# ---------------------------------------------------------------------------
mlit_ksj:
  terms_url: "https://nlftp.mlit.go.jp/ksj/other/agreement.html"
  terms_effective: "2026-03-23"
  legacy_terms_url: "https://nlftp.mlit.go.jp/ksj/other/agreement_02.html"
  list_url: "https://nlftp.mlit.go.jp/ksj/index.html"
  evidence: terms_page_read
  default_license: "公共データ利用規約（第1.0版） (PDL 1.0)"
  carve_outs:
    section_1_2_individual_law:
      description: "個別法令による利用の規制があるコンテンツ（国土調査系のみ）"
      datasets:
        - "20万分の1土地分類基本調査"
        - "土地保全基本調査"
        - "20万分の1シームレス土地保全図"
        - "5万分1都道府県土地分類基本調査"
        - "土地履歴調査"
        - "災害類型別土地保全調査"
        - "主要水系調査"
        - "都道府県水調査（利水現況図）"
        - "地下水調査（地下水マップ）"
    section_1_3_other_rules:
      description: "本利用ルールが適用されないコンテンツ → 旧国土情報利用約款準拠版へ"
      trigger_values: ["オープンデータ（CC BY 4.0）一部制限", "商用可", "非商用", "記載なし"]
  legacy_terms_meaning:
    evidence: terms_page_read
    reviewed_on: "2026-09-02"
    source_clause: "agreement_02.html 第1条"
    商用可:
      redistribution: permitted
      commercial: permitted
      verbatim: "「商用可」＝出典・加工者等表示のうえ、原著作者等の許諾上、商用目的での利用（複製物の再配布を含む）が可能なもの"
    非商用:
      redistribution: prohibited
      commercial: prohibited
      verbatim: "「非商用」＝出典・加工者等表示のうえ、原著作者等の許諾上、非商用目的のみでの利用（ただし複製物の再配布を除く）が可能なもの"
      note: "第3条第2項も、GIS形式・エクセル形式等のデータベースは原著作者等のデータベース著作権を侵害するおそれがある旨を注記する。"
    記載なし:
      redistribution: unknown
      evidence: none
      note: >-
        Enumerated as a §1.3 trigger value but no meaning was found in agreement_02.html.
        Unhandled case in the decision rule; requires an enquiry before adopting any layer
        whose 利用許諾条件 is blank.
  decision_rule: >-
    Only layers whose 利用許諾条件 reads plainly "オープンデータ（CC BY 4.0）" sit under the
    2026-03-23 terms (PDL 1.0) and are redistributable without further conditions. Any of
    「一部制限」「商用可」「非商用」 drops the layer into the legacy 約款; 「非商用」 forbids
    redistribution outright.
  # Layer verdicts below are from the listing page's 利用許諾条件 column (evidence: secondary).
  # Each must be re-read on its own detail page before adoption.
  layers:
    clear:
      evidence: secondary
      license: "オープンデータ（CC BY 4.0） → PDL 1.0 side"
      items:
        - { id: N02, name: "鉄道（路線・駅）", join_bucket: d, note: "the open answer to the '駅情報' requirement" }
        - { id: N13, name: "道路", join_bucket: d, note: "the open alternative to OSM roads" }
        - id: N03
          name: "行政区域"
          join_bucket: a
          superseded_by_detail_page: true
          note: >-
            ⚠️ The listing page says 素の CC_BY_4.0, but the 2025 detail page adds a 測量法
            国土地理院長承認 requirement (see candidates.mlit "N03 行政区域 2025年版").
            Real verdict is `conditional`, not `clear`. Kept here to show that the listing
            page alone was wrong — the case §5.4 of the research doc warned about.
        - { id: N07, name: "バスルート", join_bucket: d }
        - { id: P11, name: "バス停留所", join_bucket: d }
        - { id: P36, name: "高速バス停留所", join_bucket: d }
        - { id: S12, name: "駅別乗降客数", join_bucket: d, note: "joins to N02 stations" }
        - { id: P29, name: "学校", join_bucket: d }
        - { id: P04, name: "医療機関", join_bucket: d }
        - { id: P05, name: "市町村役場等及び公的集会施設", join_bucket: d, note: "NOT P34, which is 非商用" }
        - { id: L01, name: "地価公示", join_bucket: d }
        - { id: L02, name: "都道府県地価調査", join_bucket: d }
        - { id: A31, name: "洪水浸水想定区域 (a/b)", join_bucket: d }
        - { id: A51, name: "雨水出水（内水）浸水想定区域", join_bucket: d }
        - { id: A52, name: "砂防指定地", join_bucket: d }
        - { id: A53, name: "多段階浸水想定", join_bucket: d }
        - { id: A55, name: "都市計画決定情報", join_bucket: d }
        - { id: A56, name: "宅地造成等工事規制区域・特定盛土等規制区域", join_bucket: d }
        - { id: A54, name: "大規模盛土造成地", join_bucket: d }
        - { id: A09, name: "都市地域", join_bucket: d }
        - { id: A38, name: "医療圏", join_bucket: d }
        - { id: A42, name: "歴史的風土保存区域", join_bucket: d }
        - { id: A43, name: "伝統的建造物群保存地区", join_bucket: d }
