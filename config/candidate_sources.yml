            note: "2025年版で追加。v3.1 には無い"
          - code: N03_007
            name: 全国地方公共団体コード
            verbatim: "JIS X 0401で定められている都道府県コード2桁と、JIS X 0402で定められている市区町村コード3桁から構成される5桁の数字で表現されたコード"
            note: >-
              5桁。ゼロ始まりがあるので文字列で読む。UNRESOLVED: the definition says nothing
              about 政令指定都市, and N03_005 exists as a separate ward-name attribute, so
              whether N03_007 holds the ward code (14101) or the city code (14100) is not
              decidable from the page. Measure it on 神奈川県 before writing the join.
              See docs/N03_BOUNDARY_DESIGN.md §4.1.
        measured_2026_09_05:
          note: >-
