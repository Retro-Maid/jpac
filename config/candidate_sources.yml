          null_jis_city_code: 0
          lg_prefix_mismatches: 0
          ward_rows: 171
          designated_city_parents: 20
        gate: >-
          NOT cleared for config/sources.yml. LICENSE_POLICY.md §4 requires a human to read
          the detail page and agreement.html verbatim and commit text_sha256 with a
          rationale. Additionally, and before that, the 国土地理院 approval question in
          survey_restriction.unresolved must be settled — a CC BY 4.0 reading alone does not
