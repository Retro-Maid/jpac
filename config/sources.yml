http:
  timeout_connect_s: 15
  timeout_read_s: 120
  max_retries: 3
  retry_on: [500, 502, 503, 504, connection_error]
  backoff_base_s: 2
  max_download_bytes: 536870912        # 512 MiB
  max_uncompressed_bytes: 2147483648   # 2 GiB
  max_archive_members: 200
  max_compression_ratio: 200
  require_https: true
  user_agent: "jp-address-crosswalk/1.0 (+https://github.com/jp-address-crosswalk)"
