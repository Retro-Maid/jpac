      review_2026_09_14: >-
        2026-09-14、人が読んで再配布可と判断した。判断の対象は
        docs/LICENSE_REVIEW_2026_09.md §9.1 が絞り込んだ2論点である。
        §8.1 —— e-Stat 利用規約 ３)イ の別紙除外と gis-terms 第6条の二段構造を、
        データの利用条件が本体規約に帰着すると読んでよいか。読んでよいと判断した。
        §8.3 —— 調査区の境界を設定した地方公共団体が同規約 ２)ア の「第三者」に当たらないと
        読んでよいか。当たらないと判断した。ただしこれは権利処理済である旨の明示に代わる
        解釈であり、明示が無いことを承知のうえでの判断である。下読みの結論と相違は無かった。
        下の ai_pre_read_2026_09_05 は AI による下読みであって人の判断の記録ではない。
        条項の引用と省令の参照はそこに置いたまま残し、人が確認した範囲だけを
        この項に書いている。全文は同ドキュメント §8 にある。
      # ⚠️ 以下は AI が書いた下読みである。人の判断は上の review_2026_09_14 にある。
      # LICENSE_POLICY.md §4 のゲートを通すのは人の署名であって、この文章ではない。
      ai_pre_read_2026_09_05: >-
        e-Stat 利用規約、統計地理情報システム機能利用規約（全13条）、境界データの注意事項、
        および定義書を逐語で読んだ。
        規約の連鎖は二段である。e-Stat 利用規約 ３)イ は「別の利用ルールの適用を明示している
        コンテンツ」を適用外とし、その別紙に「統計地理情報システムの利用について」（リンク先は
        /gis-terms）を挙げている。一方その gis-terms 第6条は「本機能が提供する情報（コンテンツ）
        の利用条件等は、『政府統計の総合窓口（e-Stat）利用規約』に準じるものとします」と定める。
        内閣官房IT総合戦略室「政府標準利用規約（第2.0版）の解説」は、別の利用ルールを適用する
        コンテンツについて「１．のルールは適用されないこととなるため、必要に応じ、１．の
        ５）、６）で定めているような事項を別の利用ルールの中でも定めることが求められる」とし、
        本体と異なる利用条件を設ける場合は「具体的かつ合理的な根拠」を明示する責任を課している。
        gis-terms は免責（第9条）と準拠法・裁判管轄（第12条）を自前で定める一方、コンテンツの
        ライセンスについて本体と異なる条件を定めておらず、その根拠の説明も置いていない。
        したがって別紙掲載はシステム固有の利用ルール文書の存在を示すものであって、データの
        ライセンスを本体規約から外すものではなく、コンテンツの利用条件は第6条により e-Stat
        利用規約に帰着すると判断した。同規約は複製・公衆送信・翻案を認め商用利用も可としており、
        CC BY 4.0 と互換である旨を明記している。gis-terms 第7条（禁止事項）は運用妨害・運用支障・
        法令違反の3つのみで、再配布を禁じる条項は無い。
        第三者の権利（同規約 ２)ア）については、次の2経路を検討した。(1) 国土地理院の測量成果:
        規約・注意事項・定義書のいずれにも測量法および承認に関する記載が無く、国土地理院への
        言及は「面積が公式値と一致しない」という比較のみである。N03 が承認番号と複製条項を
        明示しているのと対照的であり、乗っていないと判断した。(2) 調査区の境界を設定した地方
        公共団体: 国勢調査の調査区の設定の基準等に関する省令（昭和59年総理府令第24号）第一条は
        一般調査区・特別調査区・水面調査区のいずれも「総務大臣の定める方法により」設定すると
        定めており、地方公共団体は法定受託事務としてこの方法に従う。境界は地方公共団体の独自
        創作ではないため「第三者（国以外の者）が著作権その他の権利を有している」には当たらないと
        判断した。なお同規約は「特に権利処理済であることが明示されているものを除き」と定めており、
        境界データについて権利処理済である旨の明示は無い。上記は明示に代わる解釈であり、
        その点を承知のうえで再配布可と判断した。
        gis-terms 第1条2項の「本機能で使用している背景地図の利用規約」は jSTAT MAP の画面表示に
        関するものであり、境界データ Shapefile のダウンロード（ログイン不要で取得できることを
        確認済）には介在しないと判断した。
