# Matching rules — see docs/MATCHING_RULES.md
# confidence is a deterministic rule-based trust score, NOT a probability.
version: "1.3.0"

auto_accept:
  min_confidence: 0.98
  max_candidate_count: 1
  allowed_relation_types: [exact, equivalent]
  require_is_unique_match: true
  reject_if_override_stale: true

postal:
  - id: P0
    description: "Manual override"
    relation_type: from_override
    match_method: manual_override
    confidence: from_override
    precedence: 0
  - id: P1
    description: "ABR official 町字-郵便番号変換表 row with machiaza_id, postal code corroborated by Japan Post ken_all"
    relation_type: equivalent
    match_method: direct_code
    confidence: 0.99
    precedence: 10
    target_table: bridge_address_postal_code
    target_entity: postal_code_entity
    rationale: >-
      Publisher-authored code mapping, independently corroborated. Not 1.00 because the
      Digital Agency labels the table 参考情報 with no completeness guarantee.
      Targets the 7-digit postal CODE, not a ken_all record: the conversion table names
      a code, and a code can appear in many ken_all records, so pointing this edge at
      one record would fabricate a record-level assertion the publisher never made.
  - id: P1x
    description: "ABR conversion-table row whose postal code is absent from Japan Post ken_all"
    relation_type: candidate
    match_method: direct_code
    confidence: 0.70
    precedence: 11
    target_table: bridge_address_postal_code
    target_entity: postal_code_entity
    rationale: "The two publishers disagree; record it, never auto-accept it."
  - id: P2
    description: "ABR conversion-table row with empty machiaza_id (municipality-level)"
    relation_type: parent
    match_method: direct_code
    confidence: 0.99
    precedence: 20
    target_table: bridge_municipality_postal
  - id: P3
    description: "Japan Post special record: no_listing / city_banchi / ichien"
    relation_type: parent
    match_method: official_area_rule
    confidence: 0.99
    precedence: 21
    target_table: bridge_municipality_postal
  - id: P4
    description: "jis_city_code + normalized town name, unique in BOTH directions"
    relation_type: exact
    match_method: normalized_name
    confidence: 0.97
    precedence: 30
    require_unique_both_directions: true
    require_parenthetical_class: [none, non_geographic]
    rationale: >-
      Only admissible when the Japan Post town field has no parenthetical, or one
      classified non-geographic. A parenthetical describing banchi ranges or exclusions
      means the postal record covers PART of the town, so it becomes P4p instead.
  - id: P4p
    description: "As P4, but the postal town field carries a geographic parenthetical"
    relation_type: overlap
    match_method: normalized_name
    confidence: 0.70
    precedence: 31
    force_verification_status: review_required
    rationale: >-
      The postal record covers only part of the ABR town, so it is not `exact`
      (docs/MATCHING_RULES.md §5).
  - id: P5
    description: "Postal town name equals ABR oaza_cho of N>=2 towns differing only by chome"
    relation_type: parent
    match_method: parent_child
    confidence: 0.90
    precedence: 40
    emit: one_row_per_chome
    rationale: "The 西新宿 case. N rows, shared candidate_group_id, never collapsed to one."
  - id: P6a
    description: "One postal record matches two or more ABR towns (not explained by P5)"
    relation_type: ambiguous
    match_method: normalized_name
    confidence: 0.50
    precedence: 50
    candidate_group_key: postal_record_id
    emit: one_row_per_abr_candidate
  - id: P6b
    description: "One ABR town is the sole name match for two or more postal records"
    relation_type: ambiguous
    match_method: normalized_name
    confidence: 0.50
    precedence: 51
    candidate_group_key: address_id
    emit: one_row_per_postal_record
    rationale: >-
      The N:1 direction. P4 rejects it because uniqueness fails one way; without P6b the
      rows would fall through to unresolved and the real candidates would be lost.
  - id: P7
    description: "No match"
    relation_type: unresolved
    match_method: unresolved
    confidence: 0.0
    precedence: 99

mlit:
  - id: M0
    description: "Manual override"
    relation_type: from_override
    match_method: manual_override
    confidence: from_override
    precedence: 0
  - id: M1
    description: "mlit_code[0:5]==jis_city_code AND mlit_code[5:12]==machiaza_id AND normalized names equal"
    relation_type: exact
    match_method: composite
    confidence: 1.00
    precedence: 10
    rationale: "Two independent signals (code structure and name) agree."
  - id: M2
    description: "Code structure matches but normalized names differ"
    relation_type: equivalent
    match_method: direct_code
    confidence: 0.90
    precedence: 20
    force_verification_status: review_required
    rationale: "A name disagreement usually means one publisher has updated and the other has not."
  - id: M3
    description: "No code match; jis_city_code + normalized name unique in BOTH directions"
    relation_type: exact
    match_method: normalized_name
    confidence: 0.97
    precedence: 30
    require_unique_both_directions: true
  - id: M4
    description: "Two or more candidates on either side"
    relation_type: ambiguous
    match_method: normalized_name
    confidence: 0.50
    precedence: 40
  - id: M5
    description: "No match"
    relation_type: unresolved
    match_method: unresolved
    confidence: 0.0
    precedence: 99

telephone:
  - id: T0
    description: "Manual override"
    relation_type: from_override
    match_method: manual_override
    confidence: from_override
    precedence: 0
  - id: T1
    description: "Clause names a municipality with no qualifier; resolves to exactly one lg_code"
    relation_type: child
    match_method: official_area_rule
    confidence: 0.99
    coverage_type: full
    precedence: 10
    target_table: bridge_municipality_telephone
  - id: T1b
    description: "Municipality name matches only after a unique-in-prefecture ヶ/ケ or ヵ/カ fold"
    relation_type: child
    match_method: official_area_rule
    confidence: 0.95
    coverage_type: full
    precedence: 11
    target_table: bridge_municipality_telephone
    rationale: >-
      The fold is confined to the closed official municipality list and is accepted
      only when exactly one lg_code remains in the prefecture. It is never used for 町字.
  - id: T1c
    description: "The official collective term 東京都23区 resolves to exactly the 23 ABR special wards"
    relation_type: child
    match_method: official_area_rule
    confidence: 0.99
    coverage_type: full
    precedence: 12
    target_table: bridge_municipality_telephone
    rationale: >-
      The rule fires only when ABR contains exactly 23 Tokyo special-ward municipalities.
  - id: T1d
    description: "Municipality name resolved by an attested alias for a publisher whose prose is out of date"
    relation_type: child
    match_method: manual_override
    confidence: 0.90
    coverage_type: full
    precedence: 13
    target_table: bridge_municipality_telephone
    derivation: attested_source_name_alias
    rationale: >-
      MIC's 市外局番の一覧 still writes 篠山市 seven years after the municipality
      renamed itself 丹波篠山市; the lg_code never changed. The alias resolves one
      string in one publisher's text and nothing else, is attested with evidence in
      overrides/source_name_aliases.yml, and is applied only after its declared
      preconditions are measured against the current build. If the publisher
      corrects the text the alias lapses and is reported, never silently reapplied.
      It scores below T1 because it is not what the source literally says.
  - id: T3
    description: "Clause carries を除く / に限る naming SUB-MUNICIPAL places"
    relation_type: overlap
    match_method: official_area_rule
    confidence: 0.70
    coverage_type: partial
    precedence: 20
    target_table: bridge_municipality_telephone
    forbid_town_expansion: true
    rationale: >-
      e.g. 北海道夕張市（富野を除く。） — the source does not enumerate 町字, so neither
      does this project. exception_text is preserved verbatim.
  - id: T4
    description: "Clause carries に限る naming WHOLE municipalities inside a 郡"
    relation_type: child
    match_method: official_area_rule
    confidence: 0.99
    coverage_type: full
    precedence: 15
  - id: T5
    description: "Clause names a 郡 with no qualifier; expanded to its municipalities"
    relation_type: child
    match_method: official_area_rule
    confidence: 0.95
    coverage_type: full
    precedence: 16
    derivation: expanded_from_county
    target_table: bridge_municipality_telephone
  - id: T6
    description: "Municipality name resolves ambiguously"
    relation_type: ambiguous
    match_method: official_area_rule
    confidence: 0.50
    coverage_type: unresolved
    precedence: 40
  - id: T7
    description: "Clause could not be parsed"
    relation_type: unresolved
    match_method: unresolved
    confidence: 0.0
    coverage_type: unresolved
    precedence: 99
    keep_exception_text: true
  - id: T10
    description: "MIC evidence exists only at municipality level; town assignment intentionally withheld"
    relation_type: unresolved
    match_method: unresolved
    confidence: 0.0
    coverage_type: municipality_only
    precedence: 100
    target_table: bridge_address_telephone
    forbid_target: true
    rationale: >-
      One unresolved row is retained per 町字 so no address is dropped, but a
      municipality-level MIC statement is never expanded into a town-level mapping.

fuzzy:
  enabled: true
  purpose: candidate_generation_only
  never_confirms: true
  blocking_key: jis_city_code
  algorithms: [jaro_winkler, token_set]
  min_similarity: 0.85
  # Counts are computed over the COMPLETE candidate set before any capping, and the
  # cap applies only to how many are rendered in the review report. A capped set never
  # determines candidate_count or is_unique_match (P1-7).
  count_before_cap: true
  report_render_cap: 10
  overflow_marker: true
  rationale: >-
    Similarity may only surface candidates into reports/review_required.csv.
    It never sets confidence and never produces exact or equivalent. If more candidates
    exist than the render cap, the true count is stored and an overflow flag is set, so
    a truncated display can never be mistaken for the full ambiguity set.
