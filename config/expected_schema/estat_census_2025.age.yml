- note:2) 「国籍総数」については、日本人・外国人の別「不詳」の者を含む。
- note:3) 地域名において、「旧：○○○」と表記されている項目は「2000年（平成12年）市区町村」を示す。「2000年（平成12年）市区町村」については、令和２年10月１日現在の市区町村の境域に基づいて平成12年10月１日時点の市区町村に組み替えた、令和７年10月１日現在の結果数値を表章している。
