- note:【原数値】令和７年国勢調査　人口等基本集計
- note:第１－１表　男女別人口、世帯の種類別世帯数及び世帯人員並びに2020年（令和2年）の人口（組替）、2020年（令和2年）の世帯数（組替）、5年間の人口増減数、5年間の人口増減率、5年間の世帯増減数、5年間の世帯増減率、人口性比、面積（参考）及び人口密度－全国、都道府県、市区町村（2000年（平成12年）市区町村含む）
- note:1) 「2020年（令和２年）の人口（組替）」及び「2020年（令和２年）の世帯数（組替）」は、 令和７年10月１日現在の市区町村の境域に基づいて組み替えた令和２年の人口及び世帯数を示す。
- note:2) 「5年間の人口増減数（率）」及び「5年間の世帯増減数（率）」については、それぞれ「2020年（令和２年）の人口（組替）」及び「2020年（令和２年）の世帯数（組替）」と比較したもの。
- note:3) 「人口性比」とは、女性100人に対する男性の数を示す。
- note:4) 地域名において、「旧：○○○」と表記されている項目は「2000年（平成12年）市区町村」を示す。「2000年（平成12年）市区町村」については、令和７年10月１日現在の市区町村の境域に基づいて平成12年10月１日時点の市区町村に組み替えた、令和７年10月１日現在の結果数値を表章している。
- note:5) 「面積（参考）」については、国土交通省国土地理院「令和７年全国都道府県市区町村別面積調（10月１日時点）」による。ただし、「2000年（平成12年）市区町村」については「平成12年全国都道府県市区町村別面積調」による。また、平成12年の境界未定地域の面積については、総務省統計局において面積を算出している。（面積に関する主な留意事項は「令和７年国勢調査　面積及び人口密度に関する留意事項」を参照）
- note:6) 「人口密度」については、国勢調査施行規則第１条に基づいて調査対象外とした地域の面積を除いて算出。（詳細は「令和７年国勢調査　面積及び人口密度に関する留意事項」を参照）
