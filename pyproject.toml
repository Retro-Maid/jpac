[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-address-crosswalk"
version = "1.0.0"
description = "Reproducible crosswalk between Japan's official address and area code systems (ABR / Japan Post / MLIT / MIC)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Upper bounds are deliberate: "same code version" only means something if the
# libraries that decide dtypes and join semantics are also constrained. Polars in
# particular has changed join and group_by behaviour across majors.
dependencies = [
    "polars>=1.30,<2",
    "pyarrow>=15,<26",
    "PyYAML>=6.0,<7",
    "structlog>=24.1,<26",
    "typer>=0.12,<1",
    # Legacy MIC formats only — justified in docs/ARCHITECTURE.md §5
    "xlrd>=2.0,<3",
    "olefile>=0.47,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis>=6", "ruff", "mypy"]

[project.scripts]
jpac = "jp_address_crosswalk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# The verification scripts are deliberately linear top-to-bottom reports, and
# read each source right where that source is discussed.
"tools/*.py" = ["E402"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: typer.Option in defaults is the framework's own idiom.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real official sources (not run in PR CI)"]
filterwarnings = ["ignore::DeprecationWarning"]
